version: '3.8'

services:
  # Main Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial-report-generator
    ports:
      - "8501:8501"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - DATABASE_URL=postgresql://postgres:password@db:5432/finreport
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=development
      - DEBUG=true
    volumes:
      - ./data:/app/data
      - ./templates:/app/templates
      - ./src:/app/src  # Hot reload for development
    depends_on:
      - db
      - redis
    networks:
      - finreport-network
    restart: unless-stopped

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: finreport-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=finreport
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finreport-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: finreport-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - finreport-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  finreport-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
